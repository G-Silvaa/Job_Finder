<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><circle cx='16' cy='16' r='9' fill='none' stroke='white' stroke-width='2.5' opacity='.55'/><circle cx='16' cy='16' r='4' fill='none' stroke='white' stroke-width='2.5'/><path d='M16 16 L24 9' stroke='white' stroke-width='2.5' stroke-linecap='round'/></svg>" />
    <title>Radar de Vagas Dev</title>
    <script>
      // aplica o tema antes de pintar a tela (evita "piscar" claro no modo escuro)
      try {
        var t = localStorage.getItem('theme') || 'system';
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
